- name: Download nodesource PPA
  get_url:
    url: 'https://deb.nodesource.com/setup_{{ NODEJS_VERSION }}.x'
    dest: '/root/setup_nodejs{{ NODEJS_VERSION }}.sh'
    mode: '0755'

- name: Install nodesource PPA
  # The installer can report success after an APT failure; verify its result.
  shell: |
    set -e
    /root/setup_nodejs{{ NODEJS_VERSION }}.sh
    if ! apt-cache madison nodejs | grep -Eq '[|][[:space:]]+{{ NODEJS_VERSION }}[.]'; then
      echo 'Node.js {{ NODEJS_VERSION }} packages are unavailable after NodeSource setup' >&2
      exit 1
    fi
  register: nodesource_setup
  until: nodesource_setup is succeeded
  retries: 3
  delay: 10

- name: Update repositories cache and install prerequisites
  apt:
    name: '{{ packages }}'
    update_cache: yes
    state: present
  vars:
    packages:
      - rsync
      - sudo
      - curl
      - xfsprogs
      - 'nodejs={{ NODEJS_VERSION }}.*'

- name: Default home_dev for DigitalOcean
  set_fact:
    home_dev: /dev/sda
  when: "home_dev is not defined and provider is defined and provider.startswith('digitalocean')"

- name: 'Stat {{ home_dev }}'
  stat:
    path: "{{ home_dev | default('/nonexistent') }}"
  register: hdev

- name: 'Format {{ home_dev }} with XFS'
  filesystem:
    fstype: xfs
    dev: '{{ home_dev }}'
  when: hdev.stat.exists

- name: 'Mount {{ home_dev }}'
  mount:
    path: /home
    src: '{{ home_dev }}'
    fstype: auto
    state: mounted
  when: hdev.stat.exists

- name: Resize /home with XFS
  shell: 'xfs_growfs -n /home'
  when: hdev.stat.exists
